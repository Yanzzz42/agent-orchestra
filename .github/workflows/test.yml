name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        shell: bash
        run: for f in orchestra/*.mjs install.mjs test/*.mjs; do node --check "$f"; done
      - name: Smoke test
        run: node test/smoke.mjs
